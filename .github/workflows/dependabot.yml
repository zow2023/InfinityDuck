name: dependabot
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Makefile
        id: update_makefile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新正式 Release
          latest_release_info="$(curl -sf --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/daeuniverse/dae/releases/latest)"

          if ! echo "$latest_release_info" | jq -e '.tag_name' >/dev/null 2>&1; then
            echo "❌ 错误: 无法获取上游最新正式 Release"
            echo "$latest_release_info"
            exit 1
          fi

          latest_release_tag="$(echo "$latest_release_info" | jq -r '.tag_name')"

          # 获取 Release 对应的 Commit
          latest_commit_info="$(curl -sf --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/daeuniverse/dae/commits/$latest_release_tag")"

          if ! echo "$latest_commit_info" | jq -e '.sha' >/dev/null 2>&1; then
            echo "❌ 错误: 无法获取 Release 对应的 Commit"
            echo "$latest_commit_info"
            exit 1
          fi

          latest_commit_full="$(echo "$latest_commit_info" | jq -r '.sha')"
          latest_commit="$(echo "$latest_commit_full" | cut -b 1-7)"

          latest_core_date="$(echo "$latest_commit_info" \
            | jq -r '(.commit.committer.date // .commit.author.date)' \
            | cut -c1-10 \
            | tr '-' '.')"

          current_commit_full="$(grep '^PKG_SOURCE_VERSION:=' ./duck/Makefile | cut -d '=' -f 2)"
          current_pkg_version="$(grep '^PKG_VERSION:=' ./duck/Makefile | cut -d '=' -f 2)"

          # 判断是否需要更新
          if [ "$current_commit_full" = "$latest_commit_full" ] && \
             [ "$current_pkg_version" = "$latest_release_tag" ]; then
            echo "Upstream is already up-to-date ($latest_release_tag)."
            echo "updated=false" >> "$GITHUB_ENV"
          else
            echo "发现新的稳定版本: $latest_release_tag"
            echo "对应 Commit: $latest_commit_full"

            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" ./duck/Makefile
            pkg_version="${latest_release_tag#v}"
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$pkg_version/" ./duck/Makefile
            sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$latest_commit_full/" ./duck/Makefile
            sed -i "s/^PKG_BUILD_VERSION:=.*/PKG_BUILD_VERSION:=release-$latest_commit/" ./duck/Makefile
            sed -i "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=$latest_core_date/" ./duck/Makefile

            echo "updated=true" >> "$GITHUB_ENV"
          fi

      - name: Commit file
        if: env.updated == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "YourName"
          git add ./duck/Makefile
          git commit -m "Update $(date +%Y/%m/%d\ %H:%M:%S\ %Z)"
        continue-on-error: true

      - name: Push changes
        if: env.updated == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
        continue-on-error: true

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
        continue-on-error: true
